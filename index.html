<!DOCTYPE html>
<!--
  TRANG VỎ — đặt trên GitHub Pages để che banner
  "This application was created by a Google Apps Script user".
  Đổi tên thành index.html khi đưa lên GitHub.

  SỬA LỖI: env(safe-area-inset-*) KHÔNG hoạt động bên trong iframe
  (luôn trả 0, vì iframe không phải tài liệu gốc). Vì vậy phần chừa chỗ cho
  thanh trạng thái iPhone phải do TRANG VỎ này lo, không phải do app bên trong.
-->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ví Chi Tiêu">
<meta name="theme-color" content="#f4f7fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080c14" media="(prefers-color-scheme: dark)">
<title>Ví Chi Tiêu</title>

<!-- ===== BIỂU TƯỢNG MÀN HÌNH CHÍNH =====
     iOS chỉ đọc apple-touch-icon trên TRANG ĐƯỢC THÊM VÀO MÀN HÌNH, tức là
     chính trang vỏ này — không phải trang Apps Script bên trong iframe.
     Đường dẫn để TƯƠNG ĐỐI (không có dấu / đầu) vì site nằm ở /chi-tieu/.
     iOS KHÔNG hỗ trợ SVG cho apple-touch-icon, bắt buộc phải là PNG.
     Ảnh tràn viền, không tự bo góc — iOS tự cắt theo mặt nạ squircle. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icon-120.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    /* Chiều cao banner Google cần cắt.
       Banner xuống 2 dòng trên máy hẹp → tăng lên 64px nếu vẫn thấy mép. */
    --cut: 46px;
    /* Màu viền quanh iframe (thanh trạng thái, vùng home indicator).
       Tự theo cài đặt sáng/tối của iPhone — app bên trong cũng mặc định như vậy.
       Trang vỏ khác origin nên không đọc được lựa chọn theme đã lưu trong app;
       nếu bạn luôn ghim 1 chế độ, sửa cứng giá trị dưới đây cho khớp. */
    --shell-bg: #f4f7fc;
  }
  @media (prefers-color-scheme: dark){
    :root{ --shell-bg:#080c14; }
  }

  html,body{margin:0;padding:0;background:var(--shell-bg);overflow:hidden;}

  /* 100dvh = chiều cao thực tế còn lại, tự trừ thanh địa chỉ Safari.
     Dùng 100% hoặc 100vh sẽ tràn ~80px trên iOS khi chưa Add to Home Screen. */
  #shell{
    position:fixed;inset:0;height:100dvh;
    display:flex;flex-direction:column;
    background:var(--shell-bg);
    /* Chừa chỗ cho thanh trạng thái và home indicator — iframe bên trong
       không tự làm được việc này. Thiếu dòng này thì đồng hồ, sóng, pin
       của iPhone sẽ đè lên nội dung app. */
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* Khung cắt: iframe bị đẩy lên -var(--cut) nên banner nằm ngoài vùng nhìn thấy */
  #port{flex:1;position:relative;overflow:hidden;}
  #port iframe{
    position:absolute;top:calc(var(--cut) * -1);left:0;
    width:100%;height:calc(100% + var(--cut));
    border:0;display:block;background:var(--shell-bg);
  }
</style>
</head>
<body>
  <div id="shell">
    <div id="port">
      <!-- src được gán bằng JS để kèm mốc thời gian t0, xem script bên dưới -->
      <iframe id="app" allow="clipboard-write"></iframe>
    </div>
  </div>

<script>
/* ĐO TỐC ĐỘ THẬT:
   Người dùng bấm vào biểu tượng ở màn hình chính → trình duyệt tải trang này
   → trang này nhúng iframe → Google dựng sandbox → app mới chạy. Bản thân app
   không thấy được 3 chặng đầu, nên nó luôn báo nhanh hơn cảm nhận thật.
   Ở đây đính mốc t0 (thời điểm trang vỏ bắt đầu) vào URL. Bên trong, app đọc
   lại bằng google.script.url.getLocation() — cùng một thiết bị, cùng một đồng
   hồ, nên hiệu số là thời gian chờ THẬT tính từ lúc mở app. */
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzs3BdcQrK0TgIw4XWGinCJCL1NCR0Rf8M1eYfOowcS41Wz6w7GLSl_jOnznWg01Lbk/exec';
  var nav = 0;
  try {
    // Mốc sớm nhất trình duyệt biết: lúc bắt đầu điều hướng tới trang vỏ
    var e = performance.getEntriesByType('navigation')[0];
    nav = e ? Math.round(performance.timeOrigin + e.startTime) : Date.now();
  } catch (err) { nav = Date.now(); }
  document.getElementById('app').src = EXEC + '?t0=' + nav;
})();
</script>
</body>
</html>
